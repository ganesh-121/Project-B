<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Panel — SGCM</title>
  <meta name="description" content="SGCM Admin Panel — Manage inventory, settings and pricing."/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .admin-page { min-height:100vh; background:var(--cream); }
    .login-screen {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
    }
    .login-box {
      background:var(--cream); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:40px; width:100%; max-width:400px;
      box-shadow:0 20px 60px rgba(0,0,0,0.4); text-align:center;
    }
    .login-box .logo-name { font-size:2rem; letter-spacing:4px; color:var(--navy); }
    .login-box h3 { font-family:'Cormorant Garamond',serif; font-size:1.4rem; margin:16px 0 24px; color:var(--text-mid); }
    .dash-header {
      background:var(--navy); padding:16px 32px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:2px solid var(--gold);
    }
    .dash-header .logo-name { color:var(--gold); font-size:1.4rem; letter-spacing:3px; }
    .dash-stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin-bottom:32px; }
    .dash-stat {
      background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
      padding:22px 20px; box-shadow:var(--shadow); text-align:center;
    }
    .dash-stat-num { font-family:'Cinzel',serif; font-size:2rem; font-weight:700; color:var(--gold-dark); }
    .dash-stat-label { font-size:0.82rem; color:var(--text-light); margin-top:4px; letter-spacing:1px; }
    .dash-stat-icon { font-size:1.6rem; margin-bottom:8px; }
  </style>
</head>
<body class="admin-page">

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="logo-name">SGCM</div>
    <div style="font-size:1.6rem;margin:12px 0">🔐</div>
    <h3>Admin Login</h3>
    <div class="ornament"><span>✦</span></div>
    <div class="form-group" style="margin-top:20px;text-align:left">
      <label>Password</label>
      <input type="password" id="admin-pw" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-gold" style="width:100%;margin-top:8px" onclick="doLogin()">Login to Admin Panel</button>
    <div id="login-error" style="color:#ef4444;font-size:0.85rem;margin-top:12px;display:none">❌ Incorrect password</div>
    <a href="index.html" style="display:block;margin-top:16px;color:var(--text-light);font-size:0.85rem;text-decoration:none">← Back to Store</a>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="dash-header">
    <div class="logo-name">⚙️ SGCM Admin</div>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="index.html" class="icon-btn" style="text-decoration:none;font-size:0.85rem">🏠 Store</a>
      <button class="icon-btn" id="theme-toggle-admin">🌙</button>
      <button class="icon-btn" onclick="logout()" style="color:#ef4444;border-color:rgba(239,68,68,0.3)">🚪 Logout</button>
    </div>
  </div>

  <div class="admin-wrap">
    <!-- STATS -->
    <div class="dash-stat-grid" id="dash-stats"></div>

    <!-- TABS -->
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('inventory')">📦 Inventory</button>
      <button class="admin-tab" onclick="switchTab('customers')">👥 Customers</button>
      <button class="admin-tab" onclick="switchTab('add')">➕ Add Saree</button>
      <button class="admin-tab" onclick="switchTab('settings')">⚙️ Settings</button>
    </div>

    <!-- INVENTORY TAB -->
    <div id="tab-inventory">
      <div class="admin-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--navy)">📦 Saree Inventory</h3>
          <input type="text" id="inv-search" placeholder="🔍 Search..." style="padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--cream);color:var(--text-dark);font-family:'Lato',sans-serif;outline:none"/>
        </div>
        <div style="overflow-x:auto">
          <table class="admin-table" id="inv-table">
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Fabric</th><th>Color</th>
                <th>Occasion</th><th>Price (₹)</th><th>Discount</th>
                <th>Stock</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="inv-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- CUSTOMERS TAB -->
    <div id="tab-customers" style="display:none">
      <div class="admin-card">
        <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--navy);margin-bottom:16px">👥 Registered Customers</h3>
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Phone Number</th><th>Total Orders</th>
              </tr>
            </thead>
            <tbody id="cust-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div id="tab-add" style="display:none">
      <div class="admin-card" style="max-width:700px">
        <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--navy);margin-bottom:20px">➕ Add New Saree</h3>
        <div class="form-row">
          <div class="form-group"><label>Saree Name *</label><input type="text" id="f-name" placeholder="e.g. Kanjivaram Silk"/></div>
          <div class="form-group"><label>Fabric *</label>
            <select id="f-fabric">
              <option>Silk</option><option>Cotton</option><option>Georgette</option><option>Linen</option><option>Net</option><option>Crepe</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Color *</label><input type="text" id="f-color" placeholder="e.g. Red"/></div>
          <div class="form-group"><label>Occasion *</label>
            <select id="f-occasion">
              <option>Wedding</option><option>Festival</option><option>Party</option><option>Casual</option><option>Office</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Price (₹) *</label><input type="number" id="f-price" placeholder="e.g. 5000" min="1"/></div>
          <div class="form-group"><label>Discount (%)</label><input type="number" id="f-discount" placeholder="0" min="0" max="90" value="0"/></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Stock *</label><input type="number" id="f-stock" placeholder="e.g. 5" min="0"/></div>
          <div class="form-group"><label>Image URL (optional)</label><input type="text" id="f-image" placeholder="https://..."/></div>
        </div>
        <div class="form-group"><label>Tags (comma separated)</label><input type="text" id="f-tags" placeholder="silk, wedding, traditional"/></div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn-gold" style="flex:1;padding:13px" onclick="addSareeAdmin()">✅ Add Saree</button>
          <button class="btn-sm" style="flex:1;padding:13px" onclick="clearAddForm()">🗑️ Clear</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" style="display:none">
      <div class="admin-card" style="max-width:700px">
        <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--navy);margin-bottom:20px">⚙️ Store Settings</h3>
        <div class="form-row">
          <div class="form-group"><label>Shop Name</label><input type="text" id="s-shopName"/></div>
          <div class="form-group"><label>Full Name</label><input type="text" id="s-fullName"/></div>
        </div>
        <div class="form-group"><label>Tagline</label><input type="text" id="s-tagline"/></div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input type="text" id="s-phone"/></div>
          <div class="form-group"><label>WhatsApp (with country code)</label><input type="text" id="s-whatsapp"/></div>
        </div>
        <div class="form-group"><label>Email</label><input type="text" id="s-email"/></div>
        <div class="form-group"><label>Address</label><input type="text" id="s-address"/></div>
        <div class="form-group"><label>Banner Text</label><input type="text" id="s-bannerText"/></div>
        <div class="form-group"><label>About Text</label><textarea rows="3" id="s-aboutText"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Founded Year</label><input type="text" id="s-founded"/></div>
          <div class="form-group"><label>New Admin Password</label><input type="password" id="s-adminPassword" placeholder="Leave blank to keep current"/></div>
        </div>
        <button class="btn-gold" style="width:100%;padding:13px;margin-top:8px" onclick="saveSettingsAdmin()">💾 Save Settings</button>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
    <h3>✏️ Edit Saree</h3>
    <input type="hidden" id="edit-id"/>
    <div class="form-row">
      <div class="form-group"><label>Name</label><input type="text" id="e-name"/></div>
      <div class="form-group"><label>Fabric</label>
        <select id="e-fabric"><option>Silk</option><option>Cotton</option><option>Georgette</option><option>Linen</option><option>Net</option><option>Crepe</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Color</label><input type="text" id="e-color"/></div>
      <div class="form-group"><label>Occasion</label>
        <select id="e-occasion"><option>Wedding</option><option>Festival</option><option>Party</option><option>Casual</option><option>Office</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Price (₹)</label><input type="number" id="e-price" min="1"/></div>
      <div class="form-group"><label>Discount (%)</label><input type="number" id="e-discount" min="0" max="90"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Stock</label><input type="number" id="e-stock" min="0"/></div>
      <div class="form-group"><label>Image URL</label><input type="text" id="e-image"/></div>
    </div>
    <div class="form-group"><label>Tags (comma separated)</label><input type="text" id="e-tags"/></div>
    <button class="btn-gold" style="width:100%;margin-top:8px;padding:12px" onclick="saveEditAdmin()">💾 Save Changes</button>
  </div>
</div>

<div id="toast-container"></div>

<script src="data.js"></script>
<script>
/* ── LOGIN ── */
function doLogin() {
  const pw = document.getElementById('admin-pw').value;
  if (DB.verifyAdmin(pw)) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    DB.init();
    renderDash();
    loadSettingsForm();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('admin-pw').value = '';
  }
}
function logout() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-pw').value = '';
  document.getElementById('login-error').style.display = 'none';
}

/* ── THEME ── */
document.getElementById('theme-toggle-admin').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  DB.saveTheme(next);
  document.getElementById('theme-toggle-admin').textContent = next === 'dark' ? '☀️' : '🌙';
});
document.documentElement.setAttribute('data-theme', DB.getTheme());
document.getElementById('theme-toggle-admin').textContent = DB.getTheme() === 'dark' ? '☀️' : '🌙';

/* ── TABS ── */
function switchTab(tab) {
  ['inventory','customers','add','settings'].forEach(t => {
    const el = document.getElementById(`tab-${t}`);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.admin-tab').forEach((btn, i) => {
    btn.classList.toggle('active', ['inventory','customers','add','settings'][i] === tab);
  });
  if (tab === 'inventory') renderInventory();
  if (tab === 'customers') renderCustomers();
  if (tab === 'settings') loadSettingsForm();
}

/* ── DASHBOARD STATS ── */
function renderDash() {
  const sarees = DB.getSarees();
  const users = DB.getUsers();
  const totalVal = sarees.reduce((a,s) => a + s.price * s.stock, 0);
  const oos = sarees.filter(s => s.stock === 0).length;
  const s = DB.getSettings();
  document.getElementById('dash-stats').innerHTML = `
    <div class="dash-stat"><div class="dash-stat-icon">🥻</div><div class="dash-stat-num">${sarees.length}</div><div class="dash-stat-label">TOTAL SAREES</div></div>
    <div class="dash-stat"><div class="dash-stat-icon">👥</div><div class="dash-stat-num">${users.length}</div><div class="dash-stat-label">CUSTOMERS</div></div>
    <div class="dash-stat"><div class="dash-stat-icon">⚠️</div><div class="dash-stat-num">${oos}</div><div class="dash-stat-label">OUT OF STOCK</div></div>
    <div class="dash-stat"><div class="dash-stat-icon">💰</div><div class="dash-stat-num">₹${(totalVal/1000).toFixed(0)}K</div><div class="dash-stat-label">INVENTORY VALUE</div></div>
  `;
  renderInventory();
}

function renderCustomers() {
  const users = DB.getUsers();
  const orders = DB.getOrders();
  const tbody = document.getElementById('cust-tbody');
  if (!tbody) return;
  tbody.innerHTML = users.map((u, i) => {
    const userOrders = orders.filter(o => o.phone === u.phone).length;
    return `<tr>
      <td>${i+1}</td>
      <td><strong>${u.name}</strong></td>
      <td>${u.phone}</td>
      <td>${userOrders} orders</td>
    </tr>`;
  }).join('');
}

/* ── INVENTORY TABLE ── */
function renderInventory() {
  let sarees = DB.getSarees();
  const q = (document.getElementById('inv-search')?.value || '').toLowerCase();
  if (q) sarees = sarees.filter(s => s.name.toLowerCase().includes(q) || s.fabric.toLowerCase().includes(q) || s.color.toLowerCase().includes(q));
  const tbody = document.getElementById('inv-tbody');
  if (!tbody) return;
  tbody.innerHTML = sarees.map((s, i) => {
    const dp = Math.round(s.price * (1 - s.discount / 100));
    return `<tr>
      <td>${i+1}</td>
      <td><strong>${s.name}</strong></td>
      <td>${s.fabric}</td>
      <td>${s.color}</td>
      <td>${s.occasion}</td>
      <td>₹${s.price.toLocaleString('en-IN')} <small style="color:var(--gold-dark)">(₹${dp.toLocaleString('en-IN')})</small></td>
      <td>${s.discount}%</td>
      <td><input type="number" value="${s.stock}" min="0" style="width:60px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--cream);color:var(--text-dark)" onchange="quickStock('${s.id}',this.value)"/></td>
      <td>
        <button class="btn-sm" style="padding:5px 10px;margin-right:4px" onclick="openEdit('${s.id}')">✏️</button>
        <button class="btn-sm" style="padding:5px 10px;background:#ef4444;color:white;border-color:#ef4444" onclick="deleteSareeAdmin('${s.id}')">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}
document.getElementById('inv-search')?.addEventListener('input', renderInventory);

function quickStock(id, val) {
  DB.updateSaree(id, { stock: parseInt(val) || 0 });
  renderDash();
  showToast('✅ Stock updated');
}

/* ── ADD SAREE ── */
function addSareeAdmin() {
  const name = document.getElementById('f-name').value.trim();
  const price = parseInt(document.getElementById('f-price').value);
  const stock = parseInt(document.getElementById('f-stock').value);
  if (!name || !price || isNaN(stock)) return showToast('❌ Fill required fields');
  const tags = document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  DB.addSaree({
    name, price, stock,
    fabric: document.getElementById('f-fabric').value,
    color: document.getElementById('f-color').value,
    occasion: document.getElementById('f-occasion').value,
    discount: parseInt(document.getElementById('f-discount').value) || 0,
    image: document.getElementById('f-image').value.trim(),
    tags
  });
  clearAddForm();
  renderDash();
  showToast(`✅ "${name}" added successfully!`);
  switchTab('inventory');
}
function clearAddForm() {
  ['f-name','f-color','f-price','f-stock','f-image','f-tags'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('f-discount').value = '0';
}

/* ── EDIT ── */
function openEdit(id) {
  const s = DB.getSarees().find(x => x.id === id);
  if (!s) return;
  document.getElementById('edit-id').value = s.id;
  document.getElementById('e-name').value = s.name;
  document.getElementById('e-fabric').value = s.fabric;
  document.getElementById('e-color').value = s.color;
  document.getElementById('e-occasion').value = s.occasion;
  document.getElementById('e-price').value = s.price;
  document.getElementById('e-discount').value = s.discount;
  document.getElementById('e-stock').value = s.stock;
  document.getElementById('e-image').value = s.image || '';
  document.getElementById('e-tags').value = (s.tags||[]).join(', ');
  openModal('edit-modal');
}
function saveEditAdmin() {
  const id = document.getElementById('edit-id').value;
  const tags = document.getElementById('e-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  DB.updateSaree(id, {
    name: document.getElementById('e-name').value,
    fabric: document.getElementById('e-fabric').value,
    color: document.getElementById('e-color').value,
    occasion: document.getElementById('e-occasion').value,
    price: parseInt(document.getElementById('e-price').value),
    discount: parseInt(document.getElementById('e-discount').value) || 0,
    stock: parseInt(document.getElementById('e-stock').value) || 0,
    image: document.getElementById('e-image').value.trim(),
    tags
  });
  closeModal('edit-modal');
  renderDash();
  showToast('✅ Saree updated!');
}

/* ── DELETE ── */
function deleteSareeAdmin(id) {
  const s = DB.getSarees().find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Delete "${s.name}"? This cannot be undone.`)) return;
  DB.deleteSaree(id);
  renderDash();
  showToast(`🗑️ "${s.name}" deleted`);
}

/* ── SETTINGS ── */
function loadSettingsForm() {
  const s = DB.getSettings();
  ['shopName','fullName','tagline','phone','whatsapp','email','address','bannerText','aboutText','founded'].forEach(k => {
    const el = document.getElementById(`s-${k}`);
    if (el) el.value = s[k] || '';
  });
  document.getElementById('s-adminPassword').value = '';
}
function saveSettingsAdmin() {
  const updates = {};
  ['shopName','fullName','tagline','phone','whatsapp','email','address','bannerText','aboutText','founded'].forEach(k => {
    const el = document.getElementById(`s-${k}`);
    if (el) updates[k] = el.value.trim();
  });
  const pw = document.getElementById('s-adminPassword').value;
  if (pw) updates.adminPassword = pw;
  DB.saveSettings(updates);
  showToast('✅ Settings saved!');
}

/* ── MODAL / TOAST ── */
function openModal(id) { document.getElementById(id)?.classList.add('open'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});
function showToast(msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
